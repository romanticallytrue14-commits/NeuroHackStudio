name: Build NeuroHack Studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

            - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed --name NeuroHackStudio main.py

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_files

          $ffmpeg = Get-ChildItem ffmpeg_files -Recurse -Filter ffmpeg.exe | Select-Object -First 1

          Copy-Item $ffmpeg.FullName dist/NeuroHackStudio/ffmpeg.exe

      - name: Upload program
        uses: actions/upload-artifact@v4
        with:
          name: NeuroHackStudio-Windows
          path: dist/NeuroHackStudio/
