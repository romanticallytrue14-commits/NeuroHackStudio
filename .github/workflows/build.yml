name: Build NeuroHack Studio 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed --name NeuroHackStudio main.py

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_files

          $ffmpeg = Get-ChildItem ffmpeg_files -Recurse -Filter ffmpeg.exe |
            Select-Object -First 1

          Copy-Item $ffmpeg.FullName dist/NeuroHackStudio/ffmpeg.exe

      - name: Download Piper
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" `
            -OutFile "piper.zip"

          Expand-Archive piper.zip -DestinationPath piper_files

          $piperDir = Get-ChildItem piper_files -Recurse -Filter piper.exe |
            Select-Object -First 1 -ExpandProperty DirectoryName

          Copy-Item "$piperDir\*" `
            -Destination "dist/NeuroHackStudio/" `
            -Recurse -Force

          if (!(Test-Path "dist/NeuroHackStudio/espeak-ng-data")) {
            throw "Папка espeak-ng-data не найдена!"
          }

      - name: Download voices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/NeuroHackStudio/voices

          $base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU"

          Invoke-WebRequest `
            -Uri "$base/ruslan/medium/ru_RU-ruslan-medium.onnx" `
            -OutFile "dist/NeuroHackStudio/voices/ru_RU-ruslan-medium.onnx"

          Invoke-WebRequest `
            -Uri "$base/ruslan/medium/ru_RU-ruslan-medium.onnx.json" `
            -OutFile "dist/NeuroHackStudio/voices/ru_RU-ruslan-medium.onnx.json"

          Invoke-WebRequest `
            -Uri "$base/irina/medium/ru_RU-irina-medium.onnx" `
            -OutFile "dist/NeuroHackStudio/voices/ru_RU-irina-medium.onnx"

          Invoke-WebRequest `
            -Uri "$base/irina/medium/ru_RU-irina-medium.onnx.json" `
            -OutFile "dist/NeuroHackStudio/voices/ru_RU-irina-medium.onnx.json"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeuroHackStudio-2.0
          path: dist/NeuroHackStudio/
